[project]
name = "onto-to-pages"
version = "0.1.0"
description = "Generate static documentation sites for RDF vocabularies/ontologies, using rdflib."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rdflib>=7.0",
    "jinja2>=3.1",
]

[project.scripts]
onto-to-pages = "onto_to_pages.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onto_to_pages"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
