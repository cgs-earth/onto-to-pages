name: Ontology to GitHub Pages
description: >
  Generate a static documentation site for an RDF vocabulary/ontology (using
  rdflib, no pyLODE) and optionally deploy it to GitHub Pages.

inputs:
  input:
    description: 'Path (relative to the repo root) to a single RDF file, or a directory to scan for RDF files'
    default: .
  output_dir:
    description: 'Output directory'
    default: ./onto-to-pages-dist
  base_uri:
    description: 'Ontology IRI to prefer when a source file defines more than one owl:Ontology'
    default: ''
  title:
    description: 'Site title shown on the generated index page (only used for directory builds)'
    default: ''
  theme:
    description: 'Default color theme: auto (visitor-toggleable), light, or dark'
    default: auto
  logo:
    description: 'Show the CGS logo in the sidebar (bool)'
    default: 'true'
  deploy:
    description: |
      Deploy to Github Pages (bool). Set to false to only generate the docs into
      output_dir, leaving the pages artifact upload and deploy to the caller
    default: 'true'
outputs:
  url:
    description: "Pages URL"
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.12'

    - name: Ensure pages deployment enabled
      if: inputs.deploy == 'true'
      shell: bash
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ github.token }}" \
          https://api.github.com/repos/${{ github.repository }}/pages \
          -d '{
            "build_type": "workflow"
          }'

    - name: Build ontology documentation
      shell: bash
      env:
        ONTO_INPUT: ${{ inputs.input }}
        ONTO_OUTPUT: ${{ inputs.output_dir }}
        ONTO_BASE_URI: ${{ inputs.base_uri }}
        ONTO_TITLE: ${{ inputs.title }}
        ONTO_THEME: ${{ inputs.theme }}
        ONTO_LOGO: ${{ inputs.logo }}
      run: |
        args=("$ONTO_INPUT" -o "$ONTO_OUTPUT" --theme "$ONTO_THEME")
        [ -n "$ONTO_BASE_URI" ] && args+=(--base-uri "$ONTO_BASE_URI")
        [ -n "$ONTO_TITLE" ] && args+=(--title "$ONTO_TITLE")
        [ "$ONTO_LOGO" = "false" ] && args+=(--no-logo)
        uv run --project "${{ github.action_path }}" onto-to-pages "${args[@]}"

    - name: Upload Pages Artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.output_dir }}

    - name: Delete Pages artifacts
      shell: bash
      if: failure() && inputs.deploy == 'true'
      run: |
        gh api \
          --method DELETE \
          repos/${{ github.repository }}/actions/artifacts/${{ github.artifact_id }}
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Deploy to GitHub Pages
      if: |
        inputs.deploy == 'true' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      id: deployment
      uses: actions/deploy-pages@v4
