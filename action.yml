name: PyLODE Ontology to GitHub Pages

description: 'Greet someone'
inputs:
  baseuri:
    description: 'Base URI of ontology'
    default: https://w3id.org/sal/${{ github.repository_owner }}/${{ github.event.repository.name }}
  input_dir:
    description: 'Directory searched for the input ttl files'
    default: .
  output_dir:
    description: 'Output directory'
    default: ./sal-gha
  deploy:
    description: |
      Deploy to Github Pages (bool). Set to false to only generate the docs into
      output_dir, leaving the pages artifact upload and deploy to the caller
    default: 'true'
outputs:
  url:
    description: "Pages URL"
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Ensure pages deployment enabled
      if: inputs.deploy == 'true'
      shell: bash
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ github.token }}" \
          https://api.github.com/repos/${{ github.repository }}/pages \
          -d '{
            "build_type": "workflow"
          }'

    - name: Build Pages
      uses: vliz-be-opsci/pylode-to-pages@v0
      with:
        baseuri: ${{ inputs.baseuri }}
        nsfolder: ${{ inputs.input_dir }}
        outfolder: ${{ inputs.output_dir }}

    - name: Convert TTL to JSON-LD and XML
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        pip install rdflib
        sudo chmod -R 777 "$OUTPUT_DIR"
        python <<'EOF'
        import os
        import re
        from pathlib import Path
        from rdflib import Graph

        outdir = Path(os.environ["OUTPUT_DIR"])
        outdir.mkdir(parents=True, exist_ok=True)

        matched = sorted(p for p in outdir.rglob("*.ttl") if p.is_file())
        print(f"{len(matched)} ttl file(s) found under {outdir}")
        if not matched:
            raise Exception(f"No ttl files found under {outdir}")

        for ttl in matched:
            g = Graph()
            try:
                g.parse(ttl, format="turtle")
            except Exception as err:
                # one bad ttl should not fail the whole pages deploy
                print(f"WARNING: file={ttl} could not parse as turtle, skipping: {err}")
                continue
            print(f"converting {ttl}")

            # write beside the source so the paths match the hrefs pylode puts in
            # index.html, which are relative to outdir and include any subfolder
            g.serialize(destination=ttl.with_suffix(".json"), format="json-ld", indent=2)
            g.serialize(destination=ttl.with_suffix(".xml"), format="xml", indent=2)

        # pylode gives every ontology that was parsed successfully a lone .ttl download button; 
        # expand it to .ttl/.json/.xml
        button = re.compile(r'<a href="([^"]+)\.ttl" class="myButton right-align">\.ttl</a>')
        expanded = []

        def expand(match):
            ref = match.group(1)
            expanded.append(ref)
            links = "".join(
                f'<a href="{ref}.{ext}" class="myButton">.{ext}</a>'
                for ext in ("ttl", "json", "xml")
            )
            return f'<div class="right-align">{links}</div>'

        index = outdir / "index.html"
        if index.is_file():
            index.write_text(button.sub(expand, index.read_text()))
            print(f"expanded download buttons for {len(expanded)} entr(ies): {expanded}")
        else:
            raise Exception(f"{index} not found, skipped download button rewrite")
        EOF

    - name: Upload Pages Artifact
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.output_dir }}

    - name: Delete Pages artifacts
      shell: bash
      if: failure() && inputs.deploy == 'true'
      run: |
        gh api \
          --method DELETE \
          repos/${{ github.repository }}/actions/artifacts/${{ github.artifact_id }}
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Deploy to GitHub Pages
      if: |
        inputs.deploy == 'true' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      id: deployment
      uses: actions/deploy-pages@v4
