name: PyLODE Ontology to GitHub Pages

description: 'Greet someone'
inputs:
  baseuri:
    description: 'Base URI of ontology'
    default: https://w3id.org/sal/${{ github.repository_owner }}/${{ github.event.repository.name }}
  output_dir:
    description: 'Output directory'
    default: ./sal-gha
  deploy:
    description: 'Deploy to Github Pages (bool)'
    default: 'true'
  file_regex:
    description: >-
      Python regex picking which files under output_dir get converted to JSON-LD
      and XML. Applied with re.search to each file path relative to output_dir,
      using forward slashes (e.g. "sub/onto-two.ttl"). Defaults to every .ttl
      file. Note that pylode only ever indexes **/*.ttl, so this is for
      narrowing the set (e.g. '^(?!.*_draft).*\.ttl$' to skip drafts) rather
      than pulling in other extensions. Keep the trailing $ — pylode writes a
      <name>.ttl.bak backup beside each ontology, which an unanchored pattern
      like '\.ttl' would match.
    default: '.*\.ttl$'
outputs:
  url:
    description: "Pages URL"
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Ensure pages deployment enabled
      shell: bash
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ github.token }}" \
          https://api.github.com/repos/${{ github.repository }}/pages \
          -d '{
            "build_type": "workflow"
          }'

    - name: Build Pages
      uses: vliz-be-opsci/pylode-to-pages@v0
      with:
        baseuri: ${{ inputs.baseuri }}
        outfolder: ${{ inputs.output_dir }}

    - name: Convert TTL to JSON-LD and XML
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        FILE_REGEX: ${{ inputs.file_regex }}
      run: |
        pip install rdflib
        sudo chmod -R 777 "$OUTPUT_DIR"
        python <<'EOF'
        import os
        import re
        from pathlib import Path
        from rdflib import Graph

        outdir = Path(os.environ["OUTPUT_DIR"])
        outdir.mkdir(parents=True, exist_ok=True)

        pattern = re.compile(os.environ["FILE_REGEX"])

        matched = sorted(
            p for p in outdir.rglob("*")
            if p.is_file() and pattern.search(p.relative_to(outdir).as_posix())
        )
        print(f"{len(matched)} file(s) matched {pattern.pattern!r}")
        if not matched:
            raise Exception(f"No files under {outdir} matched {pattern.pattern!r}")

        for ttl in matched:
            g = Graph()
            try:
                g.parse(ttl, format="turtle")
            except Exception as err:
                # a widened file_regex can pick up non-turtle files; skipping one
                # of those should not fail the whole pages deploy
                print(f"WARNING: file={ttl} could not parse as turtle, skipping: {err}")
                continue
            print(f"converting {ttl}")

            # write beside the source so the paths match the hrefs pylode puts in
            # index.html, which are relative to outdir and include any subfolder
            g.serialize(destination=ttl.with_suffix(".json"), format="json-ld", indent=2)
            g.serialize(destination=ttl.with_suffix(".xml"), format="xml", indent=2)

        # pylode gives every ontology a lone .ttl download button; expand it to
        # .ttl/.json/.xml, but only where the conversions were successful
        button = re.compile(r'<a href="([^"]+)\.ttl" class="myButton right-align">\.ttl</a>')
        expanded = []

        def expand(match):
            ref = match.group(1)
            if not all((outdir / f"{ref}.{ext}").is_file() for ext in ("json", "xml")):
                return match.group(0)
            expanded.append(ref)
            links = "".join(
                f'<a href="{ref}.{ext}" class="myButton">.{ext}</a>'
                for ext in ("ttl", "json", "xml")
            )
            return f'<div class="right-align">{links}</div>'

        index = outdir / "index.html"
        if index.is_file():
            index.write_text(button.sub(expand, index.read_text()))
            print(f"expanded download buttons for {len(expanded)} entr(ies): {expanded}")
        else:
            raise Exception(f"{index} not found, skipped download button rewrite")
        EOF

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.output_dir }}

    - name: Delete Pages artifacts
      shell: bash
      if: failure()
      run: |
        gh api \
          --method DELETE \
          repos/${{ github.repository }}/actions/artifacts/${{ github.artifact_id }}
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Deploy to GitHub Pages
      if: |
        inputs.deploy == 'true' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      id: deployment
      uses: actions/deploy-pages@v4
