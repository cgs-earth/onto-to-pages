<!DOCTYPE html>
<html lang="en"{% if theme in ("light", "dark") %} data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title or "Ontology Documentation" }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_prefix|default('') }}_static/style.css">
  <script>
    (function () {
      {% if theme in ("light", "dark") %}
      return; /* theme fixed by the build config, nothing for the visitor to override */
      {% endif %}
      try {
        var saved = localStorage.getItem("onto-to-pages-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      {% block sidebar %}{% endblock %}
    </aside>
    <main>
      <div class="topbar">
        {% if theme == "auto" %}
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        {% endif %}
      </div>
      {% block content %}{% endblock %}
      <footer class="site-footer">
        <p>Generated with <a href="https://github.com/cgs-earth/onto-to-pages">onto-to-pages</a>.</p>
        {% if show_logo %}
        <a class="footer-brand" href="https://cgsearth.org/" target="_blank" rel="noopener noreferrer">
          <img class="footer-brand-logo" src="{{ static_prefix|default('') }}_static/cgs-logo.png" alt="">
          Maintained by the Center for Geospatial Solutions
        </a>
        {% endif %}
      </footer>
    </main>
  </div>
  {% if theme == "auto" %}
  <script src="{{ static_prefix|default('') }}_static/theme.js"></script>
  {% endif %}
  <script src="{{ static_prefix|default('') }}_static/sidebar.js"></script>
</body>
</html>
